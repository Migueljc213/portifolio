<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#0f0a1e"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="210" height="450" fill="#1a1030"/>
