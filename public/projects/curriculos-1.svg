  <rect x="16" y="14" width="32" height="32" rx="8" fill="#a855f7"/>
  <text x="56" y="35" fill="white" font-size="13" font-weight="bold" font-family="sans-serif">CV com IA</text>
  <!-- Nav items -->
  <rect x="12" y="66" width="186" height="34" rx="6" fill="#a855f7" opacity="0.2"/>
  <rect x="22" y="77" width="12" height="12" rx="2" fill="#a855f7"/>
  <text x="42" y="88" fill="#a855f7" font-size="12" font-weight="600" font-family="sans-serif">Gerar Currículo</text>
  <rect x="22" y="114" width="12" height="12" rx="2" fill="#64748b"/>
  <text x="42" y="125" fill="#64748b" font-size="12" font-family="sans-serif">Templates</text>
  <rect x="22" y="148" width="12" height="12" rx="2" fill="#64748b"/>
  <text x="42" y="159" fill="#64748b" font-size="12" font-family="sans-serif">Histórico</text>
  <rect x="22" y="182" width="12" height="12" rx="2" fill="#64748b"/>
  <text x="42" y="193" fill="#64748b" font-size="12" font-family="sans-serif">Meu Contexto</text>
  <!-- Template selector (bottom of sidebar) -->
  <text x="16" y="320" fill="#64748b" font-size="10" font-family="sans-serif">TEMPLATE</text>
  <rect x="16" y="330" width="86" height="52" rx="6" fill="#a855f7" opacity="0.3" stroke="#a855f7" stroke-width="2"/>
  <text x="59" y="361" fill="#a855f7" font-size="9" font-family="sans-serif" text-anchor="middle">Moderno</text>
  <rect x="114" y="330" width="86" height="52" rx="6" fill="#1e293b"/>
  <text x="157" y="361" fill="#64748b" font-size="9" font-family="sans-serif" text-anchor="middle">Minimalista</text>
  <!-- Header -->
  <rect x="210" y="0" width="590" height="52" fill="#160d28"/>
  <text x="230" y="32" fill="white" font-size="15" font-weight="bold" font-family="sans-serif">Gerar Currículo com IA</text>
  <rect x="696" y="12" width="90" height="28" rx="14" fill="#7c3aed"/>
  <text x="741" y="31" fill="white" font-size="11" font-family="sans-serif" text-anchor="middle">Gerar PDF</text>
  <!-- Main content -->
  <!-- Vaga input -->
  <text x="230" y="78" fill="#94a3b8" font-size="11" font-family="sans-serif">VAGA / EMPRESA</text>
  <rect x="230" y="84" width="540" height="36" rx="6" fill="#1a1030" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="242" y="107" fill="white" font-size="12" font-family="sans-serif">Desenvolvedor Full-Stack Sênior — Nubank</text>
  <!-- Resumo field -->
  <text x="230" y="142" fill="#94a3b8" font-size="11" font-family="sans-serif">RESUMO PROFISSIONAL</text>
  <rect x="230" y="148" width="540" height="80" rx="6" fill="#1a1030" stroke="#334155" stroke-width="1"/>
  <text x="242" y="168" fill="#94a3b8" font-size="11" font-family="sans-serif">Desenvolvedor Full-Stack com mais de 2 anos de experiência</text>
  <text x="242" y="184" fill="#94a3b8" font-size="11" font-family="sans-serif">construindo sistemas escaláveis. Especializado em React,</text>
  <text x="242" y="200" fill="#94a3b8" font-size="11" font-family="sans-serif">Next.js, NestJS e integrações com IA...</text>
  <!-- Habilidades split -->
  <text x="230" y="252" fill="#94a3b8" font-size="11" font-family="sans-serif">HABILIDADES BACK-END</text>
  <rect x="230" y="258" width="260" height="36" rx="6" fill="#1a1030" stroke="#334155" stroke-width="1"/>
  <text x="242" y="280" fill="#cbd5e1" font-size="11" font-family="sans-serif">Node.js, NestJS, PHP, Laravel, TypeScript</text>
  <text x="510" y="252" fill="#94a3b8" font-size="11" font-family="sans-serif">HABILIDADES FRONT-END</text>
  <rect x="510" y="258" width="260" height="36" rx="6" fill="#1a1030" stroke="#334155" stroke-width="1"/>
  <text x="522" y="280" fill="#cbd5e1" font-size="11" font-family="sans-serif">React.js, Next.js, Vue.js, Tailwind CSS</text>
  <!-- Projetos destaque -->
  <text x="230" y="322" fill="#94a3b8" font-size="11" font-family="sans-serif">PROJETOS DESTAQUE</text>
  <rect x="230" y="328" width="540" height="60" rx="6" fill="#1a1030" stroke="#334155" stroke-width="1"/>
  <text x="242" y="348" fill="white" font-size="11" font-weight="600" font-family="sans-serif">FunnelGuard AI — SaaS de automação de tráfego pago</text>
  <text x="242" y="364" fill="#94a3b8" font-size="10" font-family="sans-serif">Plataforma com dashboard analítico, Meta Ads API e IA para</text>
  <text x="242" y="378" fill="#94a3b8" font-size="10" font-family="sans-serif">otimização automática de campanhas.</text>
  <!-- Generate button -->
  <rect x="230" y="408" width="540" height="34" rx="8" fill="url(#grad1)"/>
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <text x="500" y="431" fill="white" font-size="13" font-weight="600" font-family="sans-serif" text-anchor="middle">✨ Gerar Currículo com IA</text>
</svg>
